server {
    listen 80;
    server_name admin.example.com;

    root /var/www/evacare/admin-web/dist;
    index index.html;

    client_max_body_size 20M;

    location = /evacare {
        return 301 /evacare/;
    }

    location /evacare/ {
        alias /var/www/evacare/admin-web/dist/;
        try_files $uri $uri/ /evacare/index.html;
    }

    location /evacare/api/ {
        proxy_pass http://127.0.0.1:8623/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /evacare/uploads/ {
        proxy_pass http://127.0.0.1:8623/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
